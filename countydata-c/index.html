const ALL_YEARS = allData.meta.all_years.split(',').map(Number);
let currentPage = 1;
const pageSize = 5;
const ds = allData.datasets[0];

function fmt(n) { return Number(n).toLocaleString('en-US'); }

function initApp() {
  updateVarStats();
  renderVarList();
  updateSummary();
  updateYearCounts();
  showSampleSet();
}

function showPanel(panel) {
  const panels = ['vars','sample','summary'];
  document.querySelectorAll('.tabs > .tab-btn').forEach((b,i)=>b.classList.toggle('active', panels[i]===panel));
  document.querySelectorAll('.content-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+panel).classList.add('active');
}

function updateVarStats() {
  const vs = ds.vars;
  const full = vs.filter(v=>v.pct<20).length;
  const part = vs.filter(v=>v.pct>=20 && v.pct<70).length;
  const miss = vs.filter(v=>v.pct>=70).length;
  document.getElementById('varStats').innerHTML =
    '<div class="stat-card"><div class="stat-number">'+fmt(vs.length)+'</div><div class="stat-label">总变量数</div></div>'+
    '<div class="stat-card green"><div class="stat-number">'+fmt(full)+'</div><div class="stat-label">完整变量 (缺失&lt;20%)</div></div>'+
    '<div class="stat-card orange"><div class="stat-number">'+fmt(part)+'</div><div class="stat-label">部分缺失 (20%~70%)</div></div>'+
    '<div class="stat-card blue"><div class="stat-number">'+fmt(miss)+'</div><div class="stat-label">大量缺失 (&gt;70%)</div></div>';
}

function renderVarList(term) {
  term = (term||'').toLowerCase();
  let vs = ds.vars;
  if (term) vs = vs.filter(v=>v.name.toLowerCase().includes(term) || (v.label||'').toLowerCase().includes(term));
  vs = vs.slice().sort((a,b)=>a.pct-b.pct);
  document.getElementById('varList').innerHTML = vs.map((v,i)=>{
    const years = v.years ? v.years.split(',').map(y=>y.trim()) : [];
    const bar = ALL_YEARS.map(y=>{
      const has = years.includes(String(y));
      return '<div class="year-dot '+(has?'has-data':'no-data')+'" title="'+y+'年">'+String(y).slice(2)+'</div>';
    }).join('');
    const pc = v.pct>=70?'highlight':'';
    return '<div class="var-item">'+
      '<div class="var-name"><span class="var-idx">'+(i+1)+'.</span>'+v.name+'</div>'+
      (v.label?'<div class="var-label">'+v.label+'</div>':'')+
      '<div class="var-meta">'+
        '<span class="var-tag '+pc+'">缺失 '+v.pct+'% ('+fmt(v.missing)+'条)</span>'+
        '<span class="var-tag years">有数据 '+years.length+' 年</span>'+
        '<span class="var-tag">'+fmt(v.obs)+' 条有效观测</span>'+
      '</div>'+
      '<div class="var-years-bar" title="年份分布">'+bar+'</div>'+
    '</div>';
  }).join('');
}

function filterVars() { renderVarList(document.getElementById('varSearch').value); }

function updateSummary() {
  const m = allData.meta;
  document.getElementById('summaryStats').innerHTML =
    '<div class="stat-card"><div class="stat-number">'+fmt(m.n_obs)+'</div><div class="stat-label">总观测值</div></div>'+
    '<div class="stat-card green"><div class="stat-number">'+fmt(m.n_vars)+'</div><div class="stat-label">总变量数</div></div>'+
    '<div class="stat-card orange"><div class="stat-number">'+fmt(m.n_regions)+'</div><div class="stat-label">区县数</div></div>'+
    '<div class="stat-card blue"><div class="stat-number">'+m.n_years+'</div><div class="stat-label">年时间跨度</div></div>';
  document.getElementById('datasetDetails').innerHTML =
    '<div style="background:#f8f9fa;padding:20px;border-radius:10px;margin-bottom:15px;">'+
      '<h4 style="color:#667eea;margin-bottom:10px;">'+ds.name+'</h4>'+
      '<p style="color:#666;font-size:14px;margin-bottom:8px;">'+ds.desc+'</p>'+
      '<p style="color:#999;font-size:12px;">年份范围：'+m.year_min+'～'+m.year_max+'；地区数：'+fmt(m.n_regions)+'；包含 '+ds.vars.length+' 个变量</p>'+
    '</div>';
}

function updateYearCounts() {
  const yc = allData.year_counts || [];
  const box = document.getElementById('yearCounts');
  if (!box) return;
  if (!yc.length) { box.innerHTML = ''; return; }
  const max = Math.max.apply(null, yc.map(x=>x.nvar).concat([1]));
  box.innerHTML = yc.map(x=>{
    const w = x.nvar / max * 100;
    return '<div class="yc-row">'+
      '<div class="yc-year">'+x.year+'</div>'+
      '<div class="yc-bar-wrap'+(x.nvar===0?' yc-empty':'')+'"><div class="yc-bar" style="width:'+w+'%"></div></div>'+
      '<div class="yc-val">'+fmt(x.nvar)+' 个变量 · '+fmt(x.nobs)+' 观测</div>'+
    '</div>';
  }).join('');
}

  document.getElementById('sampleTable').innerHTML =
    '<thead><tr>'+sampleCols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead>'+
    '<tbody>'+pageData.map(r=>'<tr>'+sampleCols.map(c=>{
      const v = r[c];
      return '<td title="'+esc(v==null?'':v)+'">'+(v==null?'-':esc(v))+'</td>';
    }).join('')+'</tr>').join('')+'</tbody>';
  const total = Math.ceil(sampleData.length/pageSize);
  document.getElementById('pagination').innerHTML =
    '<button onclick="prevPage()" '+(currentPage===1?'disabled':'')+'>上一页</button>'+
    '<span>第 '+currentPage+' / '+total+' 页（共 '+sampleData.length+' 条，每页 '+pageSize+' 条）</span>'+
    '<button onclick="nextPage()" '+(currentPage===total?'disabled':'')+'>下一页</button>';
}
function prevPage(){ if(currentPage>1){currentPage--;renderSampleTable();} }
function nextPage(){ if(currentPage<Math.ceil(sampleData.length/pageSize)){currentPage++;renderSampleTable();} }

initApp();
</script>
</body>
</html>
