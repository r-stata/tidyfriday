                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function initApp() {
            updateVarStats();
            renderVarList();
            updateSummary();
            showSampleSet();
        }

        function showPanel(panel) {
            const panels = ['vars', 'sample', 'summary'];
            document.querySelectorAll('.tabs > .tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', panels[i] === panel);
            });
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + panel).classList.add('active');
        }

        function updateVarStats() {
            const vars = ds.vars;
            const totalVars = vars.length;
            const completeVars = vars.filter(v => v.pct < 20).length;
            const partialVars = vars.filter(v => v.pct >= 20 && v.pct < 70).length;
            const missingVars = vars.filter(v => v.pct >= 70).length;
            document.getElementById('varStats').innerHTML =
                '<div class="stat-card"><div class="stat-number">' + totalVars + '</div><div class="stat-label">总变量数</div></div>' +
                '<div class="stat-card green"><div class="stat-number">' + completeVars + '</div><div class="stat-label">完整变量 (缺失&lt;20%)</div></div>' +
                '<div class="stat-card orange"><div class="stat-number">' + partialVars + '</div><div class="stat-label">部分缺失 (20%~70%)</div></div>' +
                '<div class="stat-card blue"><div class="stat-number">' + missingVars + '</div><div class="stat-label">大量缺失 (&gt;70%)</div></div>';
        }

        function renderVarList(searchTerm) {
            searchTerm = (searchTerm || '').toLowerCase();
            let vars = ds.vars;
            if (searchTerm) {
                vars = vars.filter(v =>
                    v.name.toLowerCase().includes(searchTerm) ||
                    (v.label || '').toLowerCase().includes(searchTerm)
                );
            }
            vars = vars.slice().sort((a, b) => a.pct - b.pct);

            document.getElementById('varList').innerHTML = vars.map(v => {
                const years = v.years ? v.years.split(',').map(y => y.trim()) : [];
                const yearsBar = ALL_YEARS.map(y => {
                    const hasData = years.indexOf(String(y)) >= 0;
                    const label = String(y).slice(2);
                    return '<div class="year-dot ' + (hasData ? 'has-data' : 'no-data') + '" title="' + y + '年">' + label + '</div>';
                }).join('');
                const pctClass = v.pct >= 70 ? 'highlight' : '';
                return '<div class="var-item">' +
                    '<div class="var-name">' + esc(v.name) + '</div>' +
                    '<div class="var-label">' + esc(v.label) + '</div>' +
                    '<div class="var-meta">' +
                    '<span class="var-tag ' + pctClass + '">缺失 ' + v.pct + '% (' + v.missing + '条)</span>' +
                    '<span class="var-tag years">有数据 ' + years.length + ' 年</span>' +
                    '<span class="var-tag">' + v.obs + ' 条有效观测</span>' +
                    '</div>' +
                    '<div class="var-years-bar" title="年份分布">' + yearsBar + '</div>' +
                    '</div>';
            }).join('');
        }

        function filterVars() {
            renderVarList(document.getElementById('varSearch').value);
        }

        function updateSummary() {
            document.getElementById('summaryStats').innerHTML =
                '<div class="stat-card"><div class="stat-number">1</div><div class="stat-label">数据集</div></div>' +
                '<div class="stat-card green"><div class="stat-number">' + meta.totalObs.toLocaleString() + '</div><div class="stat-label">总观测值</div></div>' +
                '<div class="stat-card orange"><div class="stat-number">' + meta.totalVars.toLocaleString() + '</div><div class="stat-label">总变量数</div></div>' +
                '<div class="stat-card blue"><div class="stat-number">' + (meta.yearEnd - meta.yearStart + 1) + '</div><div class="stat-label">年时间跨度</div></div>';
            document.getElementById('datasetDetails').innerHTML =
                '<div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 15px;">' +
                '<h4 style="color: #667eea; margin-bottom: 10px;">' + esc(meta.name) + '</h4>' +
                '<p style="color: #666; font-size: 14px; margin-bottom: 8px;">' + esc(meta.desc) + '</p>' +
                '<p style="color: #999; font-size: 12px;">包含 ' + ds.vars.length + ' 个变量</p>' +
                '</div>';
        }

        function showSampleSet() {
            currentPage = 1;
            const sample = allData.samples[0];
            currentSampleCols = sample.cols;
            currentSampleData = sample.data;
            renderSampleTable();
        }

        function renderSampleTable() {
            const table = document.getElementById('sampleTable');
            const start = (currentPage - 1) * pageSize;
            const pageData = currentSampleData.slice(start, start + pageSize);
            const thead = '<thead><tr>' + currentSampleCols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead>';
            const tbody = '<tbody>' + pageData.map(row =>
                '<tr>' + currentSampleCols.map(c => {
                    const val = row[c];
                    const txt = (val === undefined || val === null) ? '' : String(val);
                    return '<td title="' + esc(txt) + '">' + (txt || '-') + '</td>';
                }).join('') + '</tr>'
            ).join('') + '</tbody>';
            table.innerHTML = thead + tbody;
            const totalPages = Math.ceil(currentSampleData.length / pageSize);
            document.getElementById('pagination').innerHTML =
                '<button onclick="prevPage()" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>' +
                '<span>第 ' + currentPage + ' / ' + totalPages + ' 页（共 ' + currentSampleData.length + ' 条，每页 ' + pageSize + ' 条）</span>' +
                '<button onclick="nextPage()" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
        }

        function prevPage() {
            if (currentPage > 1) { currentPage--; renderSampleTable(); }
        }

        function nextPage() {
            const totalPages = Math.ceil(currentSampleData.length / pageSize);
            if (currentPage < totalPages) { currentPage++; renderSampleTable(); }
        }

        initApp();
    </script>
</body>
</html>
