        let currentVarDataset = 0;
        let currentSampleDataset = 0;
        let currentPage = 1;
        const pageSize = 10;
        let currentSampleData = [];
        let currentSampleCols = [];
        
        // 全局年份范围
        const ALL_YEARS = Array.from({length: 27}, (_, i) => 1998 + i);
        
        function initApp() {
            updateVarStats(0);
            renderVarList(0);
            updateSummary();
            showSampleSet(0);
        }
        
        function showPanel(panel) {
            const panels = ['vars', 'sample', 'summary'];
            document.querySelectorAll('.tabs > .tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', panels[i] === panel);
            });
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + panel).classList.add('active');
        }
        
        function switchVarDataset(idx) {
            currentVarDataset = idx;
            document.querySelectorAll('#panel-vars .tabs .tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
            document.getElementById('varSearch').value = '';
            updateVarStats(idx);
            renderVarList(idx);
        }
        
        function updateVarStats(idx) {
            const ds = allData.datasets[idx];
            const statsDiv = document.getElementById('varStats');
            const totalVars = ds.vars.length;
            const completeVars = ds.vars.filter(v => v.pct < 20).length;
            const partialVars = ds.vars.filter(v => v.pct >= 20 && v.pct < 70).length;
            const missingVars = ds.vars.filter(v => v.pct >= 70).length;
            
            statsDiv.innerHTML = 
                '<div class="stat-card"><div class="stat-number">' + totalVars + '</div><div class="stat-label">总变量数</div></div>' +
                '<div class="stat-card green"><div class="stat-number">' + completeVars + '</div><div class="stat-label">完整变量 (缺失&lt;20%)</div></div>' +
                '<div class="stat-card orange"><div class="stat-number">' + partialVars + '</div><div class="stat-label">部分缺失 (20%~70%)</div></div>' +
                '<div class="stat-card blue"><div class="stat-number">' + missingVars + '</div><div class="stat-label">大量缺失 (&gt;70%)</div></div>';
        }
        
        function renderVarList(idx, searchTerm) {
            searchTerm = searchTerm || '';
            const ds = allData.datasets[idx];
            const listDiv = document.getElementById('varList');
            let vars = ds.vars;
            if (searchTerm) {
                vars = vars.filter(v => v.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }
            vars = vars.slice().sort((a, b) => b.pct - a.pct);
            
            listDiv.innerHTML = vars.map(v => {
                const years = v.years ? v.years.split(',').map(y => y.trim()) : [];
                const yearsBar = ALL_YEARS.map(y => {
                    const hasData = years.includes(String(y));
                    const label = String(y).slice(2);
                    return '<div class="year-dot ' + (hasData ? 'has-data' : 'no-data') + '" title="' + y + '年">' + label + '</div>';
                }).join('');
                
                const pctClass = v.pct >= 70 ? 'highlight' : '';
                const yearsCount = years.length;
                
                return '<div class="var-item">' +
                    '<div class="var-name">' + v.name + '</div>' +
                    '<div class="var-meta">' +
                    '<span class="var-tag ' + pctClass + '">缺失 ' + v.pct + '% (' + v.missing + '条)</span>' +
                    '<span class="var-tag years">有数据 ' + yearsCount + ' 年</span>' +
                    '<span class="var-tag">' + v.obs + ' 条有效观测</span>' +
                    '</div>' +
                    '<div class="var-years-bar" title="年份分布">' + yearsBar + '</div>' +
                    '</div>';
            }).join('');
        }
        
        function filterVars() {
            const searchTerm = document.getElementById('varSearch').value;
            renderVarList(currentVarDataset, searchTerm);
        }
        
        function updateSummary() {
            const statsDiv = document.getElementById('summaryStats');
            const detailsDiv = document.getElementById('datasetDetails');
            
            statsDiv.innerHTML = 
                '<div class="stat-card"><div class="stat-number">' + allData.datasets.length + '</div><div class="stat-label">数据集</div></div>' +
                '<div class="stat-card green"><div class="stat-number">19,056</div><div class="stat-label">总观测值</div></div>' +
                '<div class="stat-card orange"><div class="stat-number">610</div><div class="stat-label">总变量数</div></div>' +
                '<div class="stat-card blue"><div class="stat-number">27</div><div class="stat-label">年时间跨度</div></div>';
            
            detailsDiv.innerHTML = allData.datasets.map(ds => 
                '<div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 15px;">' +
                '<h4 style="color: #667eea; margin-bottom: 10px;">' + ds.name + '</h4>' +
                '<p style="color: #666; font-size: 14px; margin-bottom: 8px;">' + ds.desc + '</p>' +
                '<p style="color: #999; font-size: 12px;">包含 ' + ds.vars.length + ' 个变量</p></div>'
            ).join('');
        }
        
        function showSampleSet(idx) {
            currentSampleDataset = idx;
            currentPage = 1;
            
            document.querySelectorAll('#panel-sample .tabs .tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
            
            const sample = allData.samples[idx];
            currentSampleCols = sample.cols;
            currentSampleData = sample.data;
            renderSampleTable();
        }
        
        function renderSampleTable() {
            const table = document.getElementById('sampleTable');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentSampleData.slice(start, end);
            
            const thead = '<thead><tr>' + currentSampleCols.map(col => '<th>' + col + '</th>').join('') + '</tr></thead>';
            const tbody = '<tbody>' + pageData.map(row => 
                '<tr>' + currentSampleCols.map(col => '<td title="' + (row[col] !== undefined ? row[col] : '') + '">' + (row[col] !== undefined && row[col] !== null ? row[col] : '-') + '</td>').join('') + '</tr>'
            ).join('') + '</tbody>';
            
            table.innerHTML = thead + tbody;
            
            const totalPages = Math.ceil(currentSampleData.length / pageSize);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = 
                '<button onclick="prevPage()" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>' +
                '<span>第 ' + currentPage + ' / ' + totalPages + ' 页（共 ' + currentSampleData.length + ' 条，每页 ' + pageSize + ' 条）</span>' +
                '<button onclick="nextPage()" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderSampleTable();
            }
        }
        
        function nextPage() {
            const totalPages = Math.ceil(currentSampleData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderSampleTable();
            }
        }
        
        initApp();
    </script>
</body>
</html>
