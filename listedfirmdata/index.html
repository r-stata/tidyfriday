const meta = allData.meta;
let currentDs = 0;
let currentPage = 1;
const pageSize = 10;

function ds() { return allData.datasets[currentDs]; }

function esc(s) {
    return String(s === undefined || s === null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function fmt(n) { return Number(n).toLocaleString('zh-CN'); }

function initApp() {
    document.getElementById('subtitle').textContent = meta.desc + ' · 变量缺失情况查询、标签展示与样本预览';
    renderDatasetTabs();
    renderAll();
}

function renderDatasetTabs() {
    document.getElementById('datasetTabs').innerHTML = allData.datasets.map((d, i) =>
        '<button class="dataset-btn ' + (i === currentDs ? 'active' : '') + '" onclick="showDataset(' + i + ')">' +
        esc(d.name) +
        '<div class="desc">' + fmt(d.totalObs) + ' 条观测 · ' + fmt(d.totalVars) + ' 个变量 · ' + d.yearStart + '～' + d.yearEnd + '</div>' +
        '</button>'
    ).join('');
}

function showDataset(i) {
    currentDs = i;
    currentPage = 1;
    document.getElementById('varSearch').value = '';
    renderDatasetTabs();
    renderAll();
}

function showPanel(panel) {
    const panels = ['vars', 'sample', 'summary'];
    document.querySelectorAll('.tabs > .tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', panels[idx] === panel);
    });
    document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + panel).classList.add('active');
}

function renderAll() {
    updateVarStats();
    renderVarList();
    updateSummary();
    renderSampleTable();
}

function updateVarStats() {
    const vars = ds().vars;
    const completeVars = vars.filter(v => v.pct < 20).length;
    const partialVars = vars.filter(v => v.pct >= 20 && v.pct < 70).length;
    const missingVars = vars.filter(v => v.pct >= 70).length;
    document.getElementById('varStats').innerHTML =
        '<div class="stat-card"><div class="stat-number">' + fmt(vars.length) + '</div><div class="stat-label">总变量数</div></div>' +
        '<div class="stat-card green"><div class="stat-number">' + fmt(completeVars) + '</div><div class="stat-label">完整变量 (缺失&lt;20%)</div></div>' +
        '<div class="stat-card orange"><div class="stat-number">' + fmt(partialVars) + '</div><div class="stat-label">部分缺失 (20%~70%)</div></div>' +
        '<div class="stat-card blue"><div class="stat-number">' + fmt(missingVars) + '</div><div class="stat-label">大量缺失 (≥70%)</div></div>';
}

function renderVarList(searchTerm) {
    searchTerm = (searchTerm || '').toLowerCase();
    let vars = ds().vars;
    if (searchTerm) {
        vars = vars.filter(v =>
            v.name.toLowerCase().includes(searchTerm) ||
            (v.label || '').toLowerCase().includes(searchTerm)
        );
    }
    vars = vars.slice().sort((a, b) => a.pct - b.pct);
    const y0 = ds().yearStart, y1 = ds().yearEnd;
    const allYears = Array.from({length: y1 - y0 + 1}, (_, i) => y0 + i);

    document.getElementById('varList').innerHTML = vars.map(v => {
        const years = v.years || [];
        const yearsBar = allYears.map(y => {
            const hasData = years.indexOf(y) >= 0;
            return '<div class="year-dot ' + (hasData ? 'has-data' : 'no-data') + '" title="' + y + '年">' + String(y).slice(2) + '</div>';
        }).join('');
        const pctClass = v.pct >= 70 ? 'highlight' : '';
        const label = v.label ? '标签：' + esc(v.label) : '<span style="color:#bbb">（无标签）</span>';
        return '<div class="var-item">' +
            '<div class="var-name">' + esc(v.name) + '</div>' +
            '<div class="var-label">' + label + '</div>' +
            '<div class="var-meta">' +
            '<span class="var-tag ' + pctClass + '">缺失 ' + v.pct + '% (' + fmt(v.missing) + '条)</span>' +
            '<span class="var-tag years">有数据 ' + years.length + ' 年</span>' +
            '<span class="var-tag">' + fmt(v.obs) + ' 条有效观测</span>' +
            '<span class="var-tag">类型 ' + esc(v.type) + '</span>' +
            '</div>' +
            '<div class="var-years-bar" title="有数据年份（绿色）">' + yearsBar + '</div>' +
            '</div>';
    }).join('');
}

function filterVars() {
    renderVarList(document.getElementById('varSearch').value);
}

function updateSummary() {
    const d = ds();
    const vars = d.vars;
    const completeVars = vars.filter(v => v.pct < 20).length;
    const partialVars = vars.filter(v => v.pct >= 20 && v.pct < 70).length;
    const missingVars = vars.filter(v => v.pct >= 70).length;
    document.getElementById('summaryStats').innerHTML =
        '<div class="stat-card"><div class="stat-number">' + fmt(d.totalObs) + '</div><div class="stat-label">观测值</div></div>' +
        '<div class="stat-card green"><div class="stat-number">' + fmt(d.totalVars) + '</div><div class="stat-label">变量数</div></div>' +
        '<div class="stat-card orange"><div class="stat-number">' + (d.yearEnd - d.yearStart + 1) + '</div><div class="stat-label">年时间跨度</div></div>' +
        '<div class="stat-card blue"><div class="stat-number">' + fmt(completeVars) + '</div><div class="stat-label">完整变量 (&lt;20%缺失)</div></div>';
    document.getElementById('datasetDetails').innerHTML =
        '<div style="background:#f8f9fa;padding:20px;border-radius:10px;margin-bottom:15px;">' +
        '<h4 style="color:#667eea;margin-bottom:10px;">' + esc(d.name) + '</h4>' +
        '<p style="color:#666;font-size:14px;margin-bottom:8px;">' + esc(d.file) + '</p>' +
        '<p style="color:#999;font-size:12px;">' + d.yearStart + '～' + d.yearEnd + ' · 数据标签：' + esc(d.dataLabel || '（无）') + '</p>' +
        '<p style="color:#999;font-size:12px;">完整变量 ' + fmt(completeVars) + ' · 部分缺失 ' + fmt(partialVars) + ' · 大量缺失 ' + fmt(missingVars) + '</p>' +
        '</div>' +
        '<div style="background:#f8f9fa;padding:20px;border-radius:10px;">' +
        '<h4 style="color:#667eea;margin-bottom:10px;">全部数据集汇总</h4>' +
        '<p style="color:#666;font-size:14px;">' + meta.desc + '</p>' +
        '<p style="color:#999;font-size:12px;">年份范围 ' + meta.yearStart + '～' + meta.yearEnd + '</p>' +
        '</div>';
}

function renderSampleTable() {
    const s = ds().samples;
    const start = (currentPage - 1) * pageSize;
    const pageData = s.data.slice(start, start + pageSize);
    const thead = '<thead><tr><th>样本序号</th>' + s.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead>';
    const tbody = '<tbody>' + pageData.map(row =>
        '<tr>' + row.map((val, j) => {
            const txt = (val === null || val === undefined) ? '' : String(val);
            return '<td title="' + esc(txt) + '">' + (txt || '-') + '</td>';
        }).join('') + '</tr>'
    ).join('') + '</tbody>';
    document.getElementById('sampleTable').innerHTML = thead + tbody;

    const totalPages = Math.max(1, Math.ceil(s.data.length / pageSize));
    document.getElementById('pagination').innerHTML =
        '<button onclick="prevPage()" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button>' +
        '<span>第 ' + currentPage + ' / ' + totalPages + ' 页（共 ' + s.data.length + ' 条，每页 ' + pageSize + ' 条）</span>' +
        '<button onclick="nextPage()" ' + (currentPage === totalPages ? 'disabled' : '') + '>下一页</button>';
}

function prevPage() {
    if (currentPage > 1) { currentPage--; renderSampleTable(); }
}

function nextPage() {
    const totalPages = Math.max(1, Math.ceil(ds().samples.data.length / pageSize));
    if (currentPage < totalPages) { currentPage++; renderSampleTable(); }
}

initApp();
</script>
</body>
</html>
