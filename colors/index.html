<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Palettes · 调色板选择</title>
  <meta name="description" content="基于 ColorBrewer 魔改，并集成了 R 语言 paletteer 包中全部调色板的配色选择工具。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1>Color Palettes</h1>
      <p class="tagline">微信公众号 RStata 调色板：<code>paletteer</code> 全量调色板</p>
    </div>
    <nav class="topnav">
      <a href="https://github.com/axismaps/colorbrewer/" target="_blank" rel="noopener">ColorBrewer</a>
      <a href="https://github.com/EmilHvitfeldt/paletteer" target="_blank" rel="noopener">paletteer</a>
      <a href="https://rstata.duanshu.com/#/" target="_blank" rel="noopener">RStata 学院</a>
      <a href="https://tidyfriday.cn/" target="_blank" rel="noopener">网站首页</a>
    </nav>
  </header>

  <main class="layout">
    <!-- ============ Sidebar / controls ============ -->
    <aside class="sidebar">
      <section class="control">
        <label class="control-label">数据来源</label>
        <div class="source-tabs" id="source-tabs">
          <button class="tab active" data-source="all">全部</button>
          <button class="tab" data-source="colorbrewer">ColorBrewer</button>
          <button class="tab" data-source="custom">常用</button>
          <button class="tab" data-source="paletteer">Paletteer</button>
          <button class="tab" data-source="chinese">中国传统色</button>
        </div>
      </section>

      <section class="control">
        <label class="control-label" for="group-select">分组 / R 包</label>
        <input type="text" id="group-filter" class="text-input" placeholder="筛选分组…" autocomplete="off" />
        <select id="group-select" class="select" size="1"></select>
      </section>

      <section class="control">
        <label class="control-label" for="scheme-search">搜索调色板</label>
        <input type="text" id="scheme-search" class="text-input" placeholder="输入名称过滤…" autocomplete="off" />
      </section>

      <section class="control">
        <label class="control-label" for="num-classes">颜色数量 (classes)</label>
        <select id="num-classes" class="select"></select>
        <div class="interp-row">
          <label class="chk"><input type="checkbox" id="interp-toggle" /> 自动插值</label>
          <input type="number" id="interp-count" class="num-input" min="2" max="60" value="12" disabled />
          <span class="num-range muted">2–60</span>
        </div>
        <div class="interp-row">
          <label class="chk"><input type="checkbox" id="reverse-toggle" /> 颜色反向排序</label>
        </div>
        <p class="hint muted" id="class-hint"></p>
      </section>

      <section class="control">
        <label class="control-label">颜色格式</label>
        <div class="seg" id="format-seg">
          <button data-format="hex" class="active">HEX</button>
          <button data-format="rgb">RGB</button>
          <button data-format="cmyk">CMYK</button>
        </div>
      </section>

      <section class="control">
        <label class="control-label">导出</label>
        <div class="export-row">
          <button class="btn" id="copy-hex">复制 HEX</button>
          <button class="btn" id="copy-json">复制 JSON</button>
        </div>
        <div class="export-row">
          <button class="btn" id="dl-ase">下载 ASE</button>
          <button class="btn" id="dl-gpl">下载 GPL</button>
        </div>
        <div class="export-row">
          <button class="btn" id="copy-css">复制 CSS</button>
        </div>
        <div class="export-row">
          <button class="btn btn-highlight" id="copy-r">复制 R 语言用</button>
          <button class="btn btn-highlight" id="copy-stata">复制 Stata 用</button>
        </div>
      </section>

      <section class="control scheme-list-wrap">
        <label class="control-label">调色板 <span id="scheme-count" class="muted"></span></label>
        <div id="scheme-list" class="scheme-list"></div>
        <div class="pager" id="pager">
          <button class="btn-page" id="page-prev">‹</button>
          <span id="page-info" class="muted"></span>
          <button class="btn-page" id="page-next">›</button>
        </div>
      </section>
    </aside>

    <!-- ============ Main preview ============ -->
    <section class="preview">
      <div class="preview-head">
        <div>
          <h2 id="palette-name">—</h2>
          <p id="palette-meta" class="muted"></p>
        </div>
        <div id="score-icons" class="score-icons"></div>
      </div>

      <div class="preview-block">
        <div id="map-preview" class="map-preview"></div>
      </div>

      <div class="preview-block">
        <div id="demo" class="demo"></div>
      </div>

      <div class="color-values-head">
        <span class="control-label">颜色值</span>
        <span id="value-format-note" class="muted"></span>
      </div>
      <div id="color-values" class="color-values"></div>
    </section>
  </main>

  <div class="promo-banner">
    <span class="promo-lead">网页开发：微信公众号 <strong>RStata</strong></span>
    <span class="promo-sep">·</span>
    <span>更多实用课程与数据资料欢迎访问：<a href="https://rstata.duanshu.com/#/" target="_blank" rel="noopener">https://rstata.duanshu.com/#/</a></span>
  </div>

  <footer class="site-footer">
    <p>ColorBrewer 数据遵循 Apache 2.0 许可；R 调色板来自 <code>paletteer</code> / <code>colorspace</code> 包；中国传统色整理自 <a href="https://chinese-colors.heyfe.org/" target="_blank" rel="noopener">chinese-colors.heyfe.org</a>。© 由微信公众号 RStata 整理部署。</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- data layer (plain JS globals so it works from file:// without fetch) -->
  <script src="assets/data/colorbrewer.js"></script>
  <script src="assets/data/custom.js"></script>
  <script src="assets/data/paletteer.js"></script>
  <script src="assets/data/colorspace.js"></script>
  <script src="assets/data/chinese.js"></script>
  <script src="assets/data/map.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
